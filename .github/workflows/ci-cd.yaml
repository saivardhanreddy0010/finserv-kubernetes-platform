name: FinServ Customer API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Customer API Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t finserv-customer-api:latest \
            ./apps/customer-api

      - name: Display Docker Image
        run: docker images finserv-customer-api