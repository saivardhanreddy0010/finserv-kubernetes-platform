name: FinServ Customer API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: finserv-customer-api
  ECR_REGISTRY: 268833227305.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-scan:
    name: Build, Scan and Push Customer API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t finserv-customer-api:${{ github.sha }} \
            ./apps/customer-api

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finserv-customer-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::268833227305:role/finserv-github-actions-ecr-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag finserv-customer-api:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign Image with Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "ERROR: Could not find image digest in ECR"
            exit 1
          fi

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST"

          echo "Signing image: $IMAGE_URI"

          cosign sign --yes "$IMAGE_URI"