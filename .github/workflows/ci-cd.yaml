name: FinServ Customer API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Scan Customer API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t finserv-customer-api:latest \
            ./apps/customer-api

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finserv-customer-api:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Display Docker Image
        run: docker images finserv-customer-api