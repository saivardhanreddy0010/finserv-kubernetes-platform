apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-developer
  namespace: customer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: customer-developer-readonly
  namespace: customer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: customer-developer-readonly-binding
  namespace: customer
subjects:
  - kind: ServiceAccount
    name: customer-developer
    namespace: customer
roleRef:
  kind: Role
  name: customer-developer-readonly
  apiGroup: rbac.authorization.k8s.io
