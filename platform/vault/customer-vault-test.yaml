apiVersion: v1
kind: Pod
metadata:
  name: customer-vault-test
  namespace: customer
spec:
  serviceAccountName: customer-app
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: hashicorp/vault:2.0.4
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
