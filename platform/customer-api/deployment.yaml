apiVersion: apps/v1
kind: Deployment
metadata:
  name: finserv-customer-api
  namespace: customer
  labels:
    app: finserv-customer-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: finserv-customer-api

  template:
    metadata:
      labels:
        app: finserv-customer-api

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: customer-api
          image: 268833227305.dkr.ecr.ap-south-1.amazonaws.com/finserv-customer-api@sha256:a1d55333b925b81146a6f1ba5d2c68d0df681075aa4c39ca5ecebf33af04c5ce

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20

      volumes:
        - name: tmp
          emptyDir: {}